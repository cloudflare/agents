<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How an agent runs on Cloudflare</title>
  <desc>Requests reach your Worker, which finds one Durable Object out of many, one per user. Requests and the object's alarm both enter its Lifecycle, which starts the object's capabilities and routes work to them. The main one is the harness, the model loop, such as Pi, OpenCode, Claude Code or Codex, which runs tools. Beside it are a scheduler and WebSockets. They keep their data in the object's SQLite database. The alarm wakes the object after it sleeps or crashes. The harness calls models through Workers AI and AI Gateway. Tools run inside the object, reach outside services such as web pages, browsers, email and MCP servers, and run code the model writes in a sandbox.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BD6500"/>
    </marker>
    <marker id="arrow-from-base" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#BD6500"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="16" fill="#FBFBFB"/>

  <!-- Clients -->
  <rect x="24" y="106" width="136" height="88" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="92" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#18181B">Clients</text>
  <text x="92" y="156" text-anchor="middle" font-size="12.5" fill="#737373">browser, app, curl</text>
  <text x="92" y="174" text-anchor="middle" font-size="12.5" fill="#737373">or another agent</text>

  <line x1="160" y1="150" x2="206" y2="150" stroke="#BD6500" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Worker -->
  <rect x="208" y="106" width="172" height="88" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="294" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#18181B">Your Worker</text>
  <text x="294" y="157" text-anchor="middle" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#737373">getByName("alice")</text>
  <text x="294" y="176" text-anchor="middle" font-size="12.5" fill="#737373">finds Alice's agent</text>

  <line x1="380" y1="150" x2="427" y2="150" stroke="#BD6500" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Other users' objects, behind Alice's -->
  <rect x="474" y="14" width="252" height="70" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="600" y="30.5" text-anchor="middle" font-size="12.5" fill="#A1A1A1">Assistant "chidi"</text>
  <rect x="452" y="37" width="296" height="45" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="600" y="53.5" text-anchor="middle" font-size="12.5" fill="#A1A1A1">Assistant "bob"</text>

  <!-- Durable Object -->
  <rect x="430" y="60" width="340" height="476" rx="16" fill="#FFFFFF" stroke="#F6821F" stroke-width="3"/>
  <text x="600" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#18181B">Assistant "alice"</text>
  <text x="600" y="113" text-anchor="middle" font-size="12.5" fill="#737373">a Durable Object: one per user, task or chat</text>

  <!-- Lifecycle: requests and the alarm both arrive here -->
  <rect x="431.5" y="128" width="337" height="66" fill="#F5F5F5"/>
  <text x="600" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#18181B">Lifecycle</text>
  <text x="600" y="177" text-anchor="middle" font-size="12.5" fill="#737373">starts capabilities, routes requests and the alarm</text>

  <!-- Harness: the main capability, which runs the tools -->
  <rect x="450" y="206" width="300" height="130" rx="12" fill="#FFF7ED" stroke="#F6821F" stroke-width="2.5"/>
  <text x="600" y="231" text-anchor="middle" fill="#18181B"><tspan font-size="16" font-weight="700">Harness</tspan><tspan font-size="12.5" fill="#737373">  ·  the model loop</tspan></text>
  <rect x="461" y="242" width="34" height="22" rx="11" fill="#FFEDD4" stroke="#F6821F" stroke-width="1.5"/>
  <text x="478" y="257.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#18181B">Pi</text>
  <rect x="503" y="242" width="78" height="22" rx="11" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.5"/>
  <text x="542" y="257.5" text-anchor="middle" font-size="12.5" fill="#18181B">OpenCode</text>
  <rect x="589" y="242" width="88" height="22" rx="11" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.5"/>
  <text x="633" y="257.5" text-anchor="middle" font-size="12.5" fill="#18181B">Claude Code</text>
  <rect x="685" y="242" width="54" height="22" rx="11" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.5"/>
  <text x="712" y="257.5" text-anchor="middle" font-size="12.5" fill="#18181B">Codex</text>

  <rect x="466" y="276" width="268" height="46" rx="10" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="600" y="295" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181B">Tools</text>
  <text x="600" y="313" text-anchor="middle" font-size="12.5" fill="#737373">built-in and your own</text>

  <!-- Other capabilities -->
  <rect x="450" y="352" width="145" height="52" rx="10" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="522.5" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181B">Scheduler</text>
  <text x="522.5" y="393" text-anchor="middle" font-size="12.5" fill="#737373">cron, delays</text>

  <rect x="605" y="352" width="145" height="52" rx="10" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="677.5" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#18181B">WebSockets</text>
  <text x="677.5" y="393" text-anchor="middle" font-size="12.5" fill="#737373">live clients</text>

  <!-- SQLite -->
  <path d="M 450 436 L 450 500 A 150 16 0 0 0 750 500 L 750 436" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <ellipse cx="600" cy="436" rx="150" ry="16" fill="#F5F5F5" stroke="#E7E7E7" stroke-width="2"/>
  <text x="600" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#18181B">SQLite database</text>
  <text x="600" y="491" text-anchor="middle" font-size="12.5" fill="#737373">every message and tool call,</text>
  <text x="600" y="508" text-anchor="middle" font-size="12.5" fill="#737373">schedules, files and your own tables</text>

  <!-- Alarm loop -->
  <path d="M 430 466 C 364.7 466, 360.3 222.4, 417.6 189.6" fill="none" stroke="#BD6500" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-from-base)"/>
  <text x="362" y="312" text-anchor="end" font-size="13.5" font-weight="700" fill="#18181B">Alarm</text>
  <text x="362" y="331" text-anchor="end" font-size="12.5" fill="#737373">wakes it after it</text>
  <text x="362" y="348" text-anchor="end" font-size="12.5" fill="#737373">sleeps or crashes</text>

  <!-- What the harness and tools reach outside the object -->
  <line x1="751" y1="225" x2="796" y2="225" stroke="#BD6500" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="192" width="136" height="66" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="868" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#18181B">Models</text>
  <text x="868" y="233" text-anchor="middle" font-size="12.5" fill="#737373">Workers AI</text>
  <text x="868" y="249" text-anchor="middle" font-size="12.5" fill="#737373">AI Gateway</text>

  <line x1="734" y1="299" x2="796" y2="299" stroke="#BD6500" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="266" width="136" height="66" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="868" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#18181B">Services</text>
  <text x="868" y="307" text-anchor="middle" font-size="12.5" fill="#737373">web pages, browsers,</text>
  <text x="868" y="323" text-anchor="middle" font-size="12.5" fill="#737373">email, MCP servers</text>

  <line x1="734" y1="314" x2="796" y2="368" stroke="#BD6500" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="340" width="136" height="66" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2"/>
  <text x="868" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#18181B">Sandbox</text>
  <text x="868" y="381" text-anchor="middle" font-size="12.5" fill="#737373">runs code that</text>
  <text x="868" y="397" text-anchor="middle" font-size="12.5" fill="#737373">the model writes</text>
</svg>
