<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How an agent runs on Cloudflare</title>
  <desc>Requests reach your Worker, which calls one Durable Object per user. Inside it, a Lifecycle runs the Pi harness, a scheduler and WebSockets, which keep their data in the object's SQLite database. An alarm wakes the object after it sleeps or crashes. The harness calls models through Workers AI and AI Gateway, and tools such as web fetch, a browser, email and MCP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D84315"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="16" fill="#FFF8F3"/>

  <!-- Clients -->
  <rect x="24" y="96" width="150" height="88" rx="12" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="99" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#3A2A20">Clients</text>
  <text x="99" y="146" text-anchor="middle" font-size="12.5" fill="#6B5A50">browser, app, curl</text>
  <text x="99" y="164" text-anchor="middle" font-size="12.5" fill="#6B5A50">or another agent</text>

  <line x1="174" y1="140" x2="214" y2="140" stroke="#D84315" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Worker -->
  <rect x="218" y="96" width="168" height="88" rx="12" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="302" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#3A2A20">Your Worker</text>
  <text x="302" y="148" text-anchor="middle" font-size="12" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#6B5A50">getByName("alice")</text>
  <text x="302" y="166" text-anchor="middle" font-size="12.5" fill="#6B5A50">finds Alice's agent</text>

  <line x1="386" y1="140" x2="426" y2="140" stroke="#D84315" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Durable Object -->
  <rect x="430" y="24" width="330" height="372" rx="16" fill="#FFFFFF" stroke="#FF6B35" stroke-width="3"/>
  <text x="595" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#3A2A20">Assistant "alice"</text>
  <text x="595" y="77" text-anchor="middle" font-size="12.5" fill="#6B5A50">a Durable Object: one per user, task or chat</text>

  <!-- Lifecycle -->
  <rect x="450" y="94" width="290" height="58" rx="10" fill="#FFE4D6"/>
  <text x="595" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#3A2A20">Lifecycle</text>
  <text x="595" y="138" text-anchor="middle" font-size="12" fill="#6B5A50">starts the object, routes work, owns the alarm</text>

  <!-- Capabilities -->
  <rect x="450" y="168" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#FF6B35" stroke-width="2"/>
  <text x="495" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#3A2A20">PiHarness</text>
  <text x="495" y="213" text-anchor="middle" font-size="11.5" fill="#6B5A50">model loop</text>

  <rect x="550" y="168" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="595" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#3A2A20">Scheduler</text>
  <text x="595" y="213" text-anchor="middle" font-size="11.5" fill="#6B5A50">cron, delays</text>

  <rect x="650" y="168" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="695" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#3A2A20">WebSockets</text>
  <text x="695" y="213" text-anchor="middle" font-size="11.5" fill="#6B5A50">live clients</text>

  <!-- SQLite -->
  <path d="M 450 268 L 450 360 A 145 16 0 0 0 740 360 L 740 268" fill="#FFF1E8" stroke="#F4B393" stroke-width="2"/>
  <ellipse cx="595" cy="268" rx="145" ry="16" fill="#FFE4D6" stroke="#F4B393" stroke-width="2"/>
  <text x="595" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#3A2A20">SQLite database</text>
  <text x="595" y="329" text-anchor="middle" font-size="12" fill="#6B5A50">every step Pi takes, schedules,</text>
  <text x="595" y="347" text-anchor="middle" font-size="12" fill="#6B5A50">workspace files and your own tables</text>

  <!-- Alarm loop -->
  <path d="M 430 330 L 408 330 C 382 330, 382 200, 404 200 L 426 200" fill="none" stroke="#D84315" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="370" y="256" text-anchor="end" font-size="13" font-weight="700" fill="#3A2A20">Alarm</text>
  <text x="370" y="275" text-anchor="end" font-size="12.5" fill="#6B5A50">wakes it after it</text>
  <text x="370" y="292" text-anchor="end" font-size="12.5" fill="#6B5A50">sleeps or crashes</text>

  <!-- Models and tools -->
  <line x1="760" y1="130" x2="796" y2="130" stroke="#D84315" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="92" width="136" height="76" rx="12" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="868" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#3A2A20">Models</text>
  <text x="868" y="139" text-anchor="middle" font-size="12.5" fill="#6B5A50">Workers AI</text>
  <text x="868" y="157" text-anchor="middle" font-size="12.5" fill="#6B5A50">AI Gateway</text>

  <line x1="760" y1="220" x2="796" y2="220" stroke="#D84315" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="182" width="136" height="76" rx="12" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="868" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#3A2A20">Tools</text>
  <text x="868" y="229" text-anchor="middle" font-size="12.5" fill="#6B5A50">web, browser</text>
  <text x="868" y="247" text-anchor="middle" font-size="12.5" fill="#6B5A50">email, MCP</text>

  <line x1="760" y1="310" x2="796" y2="310" stroke="#D84315" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="800" y="272" width="136" height="76" rx="12" fill="#FFFFFF" stroke="#F4B393" stroke-width="2"/>
  <text x="868" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#3A2A20">Code</text>
  <text x="868" y="319" text-anchor="middle" font-size="12.5" fill="#6B5A50">runs in a fresh</text>
  <text x="868" y="337" text-anchor="middle" font-size="12.5" fill="#6B5A50">Dynamic Worker</text>
</svg>
