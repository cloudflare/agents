packages:
  - "agent-think"
  - "examples/*"
  - "packages/*"
  - "voice-providers/*"
  - "guides/*"
  - "experimental/*"
  - "openai-sdk/*"
  - "site/*"
  - "wip/*"
catalog:
  "@cloudflare/vitest-pool-workers": 0.19.0
  "@cloudflare/workers-types": 5.20260729.1
  "@playwright/test": 1.61.1
  "@types/node": 26.0.1
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@vitest/browser": 4.1.10
  "@vitest/browser-playwright": 4.1.10
  "@vitest/runner": 4.1.10
  playwright: 1.61.1
  react: 19.2.7
  react-dom: 19.2.7
  vite: 8.1.0
  vitest: 4.1.10
  vitest-browser-react: 2.2.0
linkWorkspacePackages: true
preferWorkspacePackages: true
patchedDependencies:
  "@chonkiejs/chunk@0.9.3": patches/@chonkiejs+chunk+0.9.3.patch
  vitest-browser-react@2.2.0: patches/vitest-browser-react+2.2.0.patch
allowBuilds:
  # pi-recovery fixture deps (@earendil-works/pi-ai); the faux provider path
  # never invokes these, so their postinstall/native builds are not needed.
  "@google/genai": false
  protobufjs: false
  "@mongodb-js/zstd": true
  autoevals: set this to true or false
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  node-liblzma: true
  nx: true
  sharp: true
  workerd: true
  # Transitive dep of @cloudflare/tanstack-ai (tanstack-recovery harness). The
  # Workers AI binding path never uses the OpenRouter SDK, so its build is skipped.
  "@openrouter/sdk": false
  # agent-think's unit tests mock GitHub over MSW; its postinstall is not needed.
  msw: false
minimumReleaseAgeExclude:
  - "@cloudflare/*"
  - "@typescript/*"
  - workerd@1.20260722.1
  - miniflare@4.20260722.1
  - partyserver@0.5.9
  - wrangler@4.115.0
  - workers-ai-provider@3.2.1 || 3.3.0 || 4.0.0
  - "@shikijs/core@4.3.0"
  - "@shikijs/engine-javascript@4.3.0"
  - "@shikijs/engine-oniguruma@4.3.0"
  - "@shikijs/langs@4.3.0"
  - "@shikijs/primitive@4.3.0"
  - "@shikijs/themes@4.3.0"
  - "@shikijs/types@4.3.0"
  - "@types/node@26.0.1"
  - framer-motion@12.42.0
  - motion-dom@12.42.0
  - nanoid@5.1.16
  - postal-mime@2.7.5
  - shiki@4.3.0
  - cronstrue@3.23.0
  - es-module-lexer@2.2.0
  - tailwindcss@4.3.2
  - "@modelcontextprotocol/core@2.0.0"
  - "@modelcontextprotocol/server@2.0.0"
  - "@modelcontextprotocol/client@2.0.0"
  - "@modelcontextprotocol/conformance@0.2.0-alpha.10"
  - "@modelcontextprotocol/sdk@1.30.0"
