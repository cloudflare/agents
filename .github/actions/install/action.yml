name: Install
description: Set up Node and install dependencies with pnpm's package cache.

inputs:
  registry-url:
    description: Registry URL for setup-node (set this when publishing).
    required: false
    default: ""
  node-version:
    description: >-
      Node version for setup-node. Defaults to the latest 24.x.
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
